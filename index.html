<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ذكريات العائلة 💛</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>ذكريات العائلة 💛</h1>

  <!-- قسم كروت الأشخاص -->
  <div id="people" class="grid"></div>

  <!-- قسم كروت الذكريات -->
  <div id="memories" class="grid"></div>

  <!-- نافذة عرض الصور بكامل الشاشة -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <button class="nav-btn prev-btn" onclick="changeImage(-1)">&#10094;</button>
    <img class="modal-content" id="fullImage" alt="ذكريات">
    <button class="nav-btn next-btn" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
<link rel="stylesheet" href="css/style.css?v=2">
<script src="js/app.js?v=2"></script>
